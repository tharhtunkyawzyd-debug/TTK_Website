<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift for Teacher 👩‍🏫✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            background-image: linear-gradient(to bottom right, #2c3e50, #1a252f);
            font-family: 'Pyidaungsu', 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .falling-item {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .gift-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 4px dashed #f39c12;
            cursor: pointer;
            transition: transform 0.3s ease;
            max-width: 320px;
            width: 90%;
            z-index: 10;
        }

        .gift-card:hover { transform: scale(1.05); }
        .gift-icon { font-size: 65px; margin-bottom: 15px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } }
        .gift-card h3 { color: #2c3e50; font-size: 18px; margin-bottom: 10px; }
        .gift-card p { color: #7f8c8d; font-size: 13px; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 999;
            padding: 20px;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #95a5a6;
            cursor: pointer;
            z-index: 1010;
        }

        .slideshow-container {
            width: 200px;
            height: 200px;
            position: relative;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #f39c12;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .teacher-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .teacher-photo.active { opacity: 1; }
        .modal-content { width: 100%; }
        .modal-content h2 { font-size: 18px; color: #c0392b; margin-bottom: 15px; }

        #typed-message {
            font-size: 14px;
            color: #34495e;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://pub-84080bc232674e2098679f6479624504.r2.dev/Justin%20Bieber%20-%20Love%20Yourself.mp3" type="audio/mpeg">
    </audio>

    <div class="gift-card" id="giftCard">
        <div class="gift-icon">🎁</div>
        <h3>ဆရာမလေးအတွက် လက်ဆောင်မွန်</h3>
        <p>ဖွင့်ကြည့်ရန် နှိပ်လိုက်ပါဦးနော် ✨</p>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="slideshow-container" id="slideshow"></div>
            <div class="modal-content">
                <h2>ဆရာမလေး ခဏလောက် အာရုံစိုက်ပေးပါဦး... 👩‍🏫✨</h2>
                <p id="typed-message"></p>
            </div>
        </div>
    </div>

    <script>
        const giftCard = document.getElementById('giftCard');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const music = document.getElementById('bgMusic');
        const typedMessage = document.getElementById('typed-message');
        const slideshow = document.getElementById('slideshow');

        const messageText = `ကျောင်းသားတွေကို တစ်နေ့လုံး စာပြရတာ ပင်ပန်းနေမှာစိုးလို့... ကျွန်တေ့ာ်ရဲ့ မပိုးအတွက် စိတ်အမောပြေစေမယ့် ဖန်တီးမှုလေးတစ်ခု လုပ်ပေးလိုက်ပါတယ်နော်။ 

ဒီနေ့အတွက် ခွန်အားဖြစ်ပါစေ ဆရာမလေး။ အမြဲတမ်း အဝေးကနေ အားပေးနေပါတယ် အမ အစစအရာရာလဲ ဂရုစိုက်ပြီးတော့ နေပါနော် ဘယ်သွားသွား မိုးမမိအောင် ထီးလေးယူသွားပါနော် ☔️💙`;

        const images = [
            'https://i.ibb.co/YFw4br5H/image-1.jpg',
            'https://i.ibb.co/rKFTt4NH/image-2.jpg',
            'https://i.ibb.co/wZSg9p31/image-3.jpg',
            'https://i.ibb.co/1YyWHg62/image-4.jpg',
            'https://i.ibb.co/C5KK7Hts/image-5.jpg',
            'https://i.ibb.co/hFGYp4tb/image-6.jpg',
            'https://i.ibb.co/p6Xktwxy/image-7.jpg'
        ];

        let currentSlideIdx = 0;
        let slideInterval;
        let typingIdx = 0;
        let isTyping = false;

        images.forEach((src, idx) => {
            const img = document.createElement('img');
            img.src = src + '?t=' + new Date().getTime(); // Laptop မှာပုံပေါ်အောင် Cache ဖြတ်သည့်စနစ်
            img.alt = `Photo ${idx + 1}`;
            img.classList.add('teacher-photo');
            if (idx === 0) img.classList.add('active');
            img.onerror = function() { 
                this.src = 'https://picsum.photos/200/200?random=' + idx; 
            };
            slideshow.appendChild(img);
        });

        const slides = document.querySelectorAll('.teacher-photo');

        giftCard.addEventListener('click', () => {
            modalOverlay.classList.add('active');
            
            // သီချင်းဖွင့်ခြင်း
            music.play().then(() => {
                console.log("Music started successfully");
            }).catch(err => {
                console.log("Audio play blocked", err);
            });

            if (!isTyping) {
                isTyping = true;
                typedMessage.innerHTML = "";
                typeWriter();
            }
            startSlideshow();
        });

        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            music.pause();
            music.currentTime = 0; 
            isTyping = false;
            typingIdx = 0;
            typedMessage.innerHTML = "";
            stopSlideshow();
        });

        function typeWriter() {
            if (typingIdx < messageText.length && isTyping) {
                typedMessage.innerHTML += messageText.charAt(typingIdx);
                typingIdx++;
                setTimeout(typeWriter, 70);
            }
        }

        function showSlide(idx) {
            slides.forEach(slide => slide.classList.remove('active'));
            if(slides[idx]) slides[idx].classList.add('active');
        }

        function nextSlide() {
            currentSlideIdx = (currentSlideIdx + 1) % images.length;
            showSlide(currentSlideIdx);
        }

        function startSlideshow() {
            if (!slideInterval) {
                currentSlideIdx = 0;
                showSlide(currentSlideIdx);
                slideInterval = setInterval(nextSlide, 3000); 
            }
        }

        function stopSlideshow() {
            if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
        }

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            const items = ['🌸', '✨', '🎈', '🍀', '☔️'];
            item.innerText = items[Math.floor(Math.random() * items.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 2 + 's';
            item.style.opacity = Math.random();
            item.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(item);
            setTimeout(() => { item.remove(); }, 5000);
        }
        setInterval(createFallingItem, 300);
    </script>
</body>
</html>
