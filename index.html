<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift for Teacher 👩‍🏫✨</title>
    <style>
        /* Base Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            background-image: linear-gradient(to bottom right, #2c3e50, #1a252f);
            font-family: 'Pyidaungsu', 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 🔳 MODAL WINDOW (ပေါ်လာမည့် Window အပြား) */
        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            z-index: 1000;
        }

        /* ❌ Close Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #95a5a6;
            cursor: pointer;
        }

        /* 📸 Slideshow Image (ဗလာဖြစ်နေတာကို ပြင်ဆင်ထားသောအပိုင်း) */
        .slideshow-container {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #f39c12; /* အဝါရောင် အဝိုင်းလေး */
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            /* အလယ်ကွက်တိဖြစ်အောင် CSS ထပ်တိုးသည် */
            margin-left: auto;
            margin-right: auto;
        }

        .teacher-photo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ပုံကို အဝိုင်းထဲ ကွက်တိဝင်အောင် ညှိသည် */
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .teacher-photo.active {
            opacity: 1;
        }

        /* 💬 Content Section */
        .modal-content h2 {
            font-size: 18px;
            color: #c0392b;
            margin-bottom: 15px;
        }

        /* Typewriter Text */
        #typed-message {
            font-size: 14px;
            color: #34495e;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="modal-box">
        <span class="close-btn">&times;</span>
        
        <div class="slideshow-container" id="slideshow">
            </div>

        <div class="modal-content">
            <h2>ဆရာမလေး ခဏလောက် အာရုံစိုက်ပေးပါဦး... 👩‍🏫✨</h2>
            <p id="typed-message"></p>
        </div>
    </div>

    <script>
        const typedMessage = document.getElementById('typed-message');
        const slideshow = document.getElementById('slideshow');

        // 💬 မင်းရဲ့ စာသားအမှန်
        const messageText = `ကျောင်းသားတွေကို တစ်နေ့လုံး စာပြရတာ ပင်ပန်းနေမှာစိုးလို့... ကျွန်တေ့ာ်ရဲ့ မပိုးအတွက် စိတ်အမောပြေစေမယ့် ဖန်တီးမှုလေးတစ်ခု လုပ်ပေးလိုက်ပါတယ်နော်။ 

ဒီနေ့အတွက် ခွန်အားဖြစ်ပါစေ ဆရာမလေး။ အမြဲတမ်း အဝေးကနေ အားပေးနေပါတယ် အမ အစစအရာရာလဲ ဂရုစိုက်ပြီးတော့ နေပါနော် ဘယ်သွားသွား မိုးမမိအောင် ထီးလေးယူသွားပါနော် ☔️💙`;

        // 📸 မင်းရဲ့ ImgBB ပုံလင့်ခ် ၇ ခု
        // 💡 မှတ်ချက် - ဒီလင့်ခ်တွေက အလုပ်မလုပ်ရင် ပုံပေါ်မှာ မဟုတ်ပါဘူး။ 
        const images = [
            'https://i.ibb.co/YFw4br5H/image-1.jpg',
            'https://i.ibb.co/rKFTt4NH/image-2.jpg',
            'https://i.ibb.co/wZSg9p31/image-3.jpg',
            'https://i.ibb.co/1YyWHg62/image-4.jpg',
            'https://i.ibb.co/C5KK7Hts/image-5.jpg',
            'https://i.ibb.co/hFGYp4tb/image-6.jpg',
            'https://i.ibb.co/p6Xktwxy/image-7.jpg'
        ];

        let currentSlideIdx = 0;
        let slideInterval;
        let typingIdx = 0;

        // Initialize Slideshow Images
        images.forEach((src, idx) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Teacher Photo ${idx + 1}`;
            img.classList.add('teacher-photo');
            if (idx === 0) img.classList.add('active');
            
            // 💡 ပုံမပေါ်လာတဲ့ပြဿနာကို ဉာဏ်ဆင်ပြီး ဖြေရှင်းသည် (Fallback)
            img.onerror = function() {
                this.src = 'https://via.placeholder.com/200?text=Photo+Missing'; // ပုံပျက်နေရင် ဒီစာသားလေး ပေါ်လာမယ်
            };
            
            slideshow.appendChild(img);
        });

        const slides = document.querySelectorAll('.teacher-photo');

        // Typewriter function
        function typeWriter() {
            if (typingIdx < messageText.length) {
                typedMessage.innerHTML += messageText.charAt(typingIdx);
                typingIdx++;
                setTimeout(typeWriter, 70);
            }
        }

        // Slideshow functions
        function showSlide(idx) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[idx].classList.add('active');
        }

        function nextSlide() {
            currentSlideIdx = (currentSlideIdx + 1) % images.length;
            showSlide(currentSlideIdx);
        }

        // Website တက်လာတာနဲ့ တန်းပွင့်အောင် လုပ်ထားသည်
        window.onload = function() {
            typeWriter();
            startSlideshow();
        };

        function startSlideshow() {
            currentSlideIdx = 0;
            showSlide(currentSlideIdx);
            slideInterval = setInterval(nextSlide, 3000); // ၃ စက္ကန့်တစ်ခါ ပုံပြောင်းမည်
        }
    </script>
</body>
</html>
